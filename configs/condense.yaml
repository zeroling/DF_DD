condensation:
  experiment_name: size_weighted_cluster_idm

  memory:
    # Windows/WDDM safety ceiling. Runtime microbatches only back off on OOM.
    max_reserved_fraction: 0.90
    real_feature_microbatch: 128
    real_train_microbatch: 128
    evaluation_batch: 128
    inference_batch: 512
    retry_minimum: 1

  idm:
    ipc: 1
    iterations: 20000
    network_depth: 3
    image_learning_rate: 0.2
    image_momentum: 0.5
    # Low-resolution IDM protocol (dataset-specific overrides may replace it).
    ce_weight_by_ipc:
      1: 0.5
      5: 0.5
      10: 0.5
      50: 0.1
      100: 0.1
      1000: 0.1
    # Faithful IDM: randomly sample one model from the dynamic queue.
    train_net_num: 1
    fetch_net_num: 2
    model_train_steps: 10
    net_num: 100
    net_generate_interval: 30
    batch_real: 256
    batch_train: 256
    # The official implementation resets each queue member's CE reliability
    # meter whenever its periodic evaluation is reached.
    reliability_reset_interval_by_ipc:
      1: 100
      5: 100
      10: 100
      50: 500
      100: 500
      1000: 500
    lr_net: 0.01
    net_momentum: 0.9
    net_weight_decay: 0.0005
    dsa_strategy: color_crop_cutout_flip_scale_rotate
    partition_expansion: 1
    minimum_reliability: 0.0
    checkpoint_interval_iterations: 50
    # Preserve an evaluation-compatible synthetic tensor every 1,000 steps.
    synthetic_snapshot_interval_iterations: 1000
    preview_interval_iterations: 500
    preview_images_per_class: 10
    log_interval_iterations: 10

  pixel_constraints:
    # Official IDM optimizes normalized pixels without projecting/clamping.
    enabled: false
    domain: normalized
    clear_outward_momentum: true

  cluster_matching:
    # High IPC uses stable coarse clusters. Stored images cover five equal-mass
    # radial layers and, at IPC=1000, balanced PCA-space directions.
    initialization_enabled: false
    matching_enabled: false
    max_clusters_per_class: 20
    layout_by_ipc:
      1: {clusters: 1, radial_layers: 1, angular_sectors: 1}
      5: {clusters: 5, radial_layers: 1, angular_sectors: 1}
      10: {clusters: 10, radial_layers: 1, angular_sectors: 1}
      50: {clusters: 10, radial_layers: 5, angular_sectors: 1}
      100: {clusters: 20, radial_layers: 5, angular_sectors: 1}
      1000: {clusters: 20, radial_layers: 5, angular_sectors: 10}
    descriptor_size: [16, 16]
    pca_components: 64
    kmeans_n_init: 10
    cache_root: outputs/cluster_cache
    # Strengthen cluster-centre matching relative to class-aware CE.
    center_loss_weight: 2.0

  cluster_spread:
    # Match radial layers, directional moments, and diagonal std per cluster.
    enabled: false
    radial_weight: 1.0
    standard_deviation_weight: 1.0
    angular_weight: 1.0
    smooth_l1_beta: 0.05
    target_gradient_fraction: 0.15
    minimum_relative_gradient_norm: 0.000001
    epsilon: 0.000000000001
    history_size: 256

  online_evaluation:
    interval_iterations: 1000
    # Dataset overrides may enable validation-loss snapshot selection. Keep it
    # disabled globally because COVID's published protocol monitors test data.
    select_best_by_loss: false
    training_steps: 500
    batch_size: 128
    evaluation_batch_size: 512
    learning_rate: 0.01
    momentum: 0.9
    weight_decay: 0.0005

  evaluation:
    architectures: [convnet, resnet18, vgg11, alexnet]
    repeats: 5
    epochs: 1000
    # HoP-TM's public evaluator loops over range(epochs + 1).
    include_epoch_zero_update: true
    batch_size: 128
    checkpoint_interval_epochs: 10
    log_interval_epochs: 10
    optimizer: sgd
    learning_rate: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    schedule: official_step
