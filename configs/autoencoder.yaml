# ============================================================================
# train_autoencoder 阶段配置：从零训练 MONAI AutoencoderKL 与可选 PatchGAN。
# ============================================================================

# autoencoder 节点只会被 Autoencoder 训练、扩散编码和最终隐变量解码使用。
autoencoder:
  # epochs 是最大训练轮数；存在断点时从已完成 epoch 继续到该目标值。
  epochs: 200
  # batch_size 是 Autoencoder 训练与验证的 batch size。
  batch_size: 20
  # learning_rate 是 AutoencoderKL 的 AdamW 初始学习率。
  learning_rate: 0.0001
  # discriminator_learning_rate 是启用 PatchGAN 时判别器的 AdamW 学习率。
  discriminator_learning_rate: 0.00002
  # min_learning_rate 是余弦退火结束时生成器和判别器的最低学习率。
  min_learning_rate: 0.000001
  # weight_decay 是 AutoencoderKL 优化器的权重衰减。
  weight_decay: 0.00001
  # discriminator_weight_decay 是 PatchGAN 优化器的权重衰减。
  discriminator_weight_decay: 0.00001
  # latent_channels 是 VAE 隐变量通道数；默认 4 与常见潜空间扩散一致。
  latent_channels: 4
  # channels 给出编码器/解码器每个分辨率阶段的通道数，长度决定下采样倍率。
  channels: [64, 128, 256, 256]
  # num_res_blocks 给出每个分辨率阶段的残差块数量，长度必须等于 channels。
  num_res_blocks: [2, 2, 2, 2]
  # attention_levels 指定每个阶段是否加入自注意力，长度必须等于 channels。
  attention_levels: [false, false, true, true]
  # norm_num_groups 是 GroupNorm 组数，每个 channels 值都必须能被它整除。
  norm_num_groups: 32
  # gradient_checkpointing=true 用计算换显存，224×224 训练通常建议开启。
  gradient_checkpointing: false
  # reconstruction_weight 是逐像素 L1 重建损失权重。
  reconstruction_weight: 1.0
  # 第一阶段先用 L1 验证连续灰度重建；确认明显优于 zero baseline 后再提高到 0.05。
  ssim_weight: 0.02
  # kl_weight 是线性预热结束后乘到“全隐变量平均 KL”上的目标权重。
  kl_weight: 0.001
  # 从第 1 个 epoch 就使用完整 KL；大型数据集的一轮含上千步，零权重会让后验均值先失控放大。
  kl_warmup_start_weight: 0.001
  # 当前关闭预热；若重新启用，起始权重也应保持非零，并密切观察 z_std 与加权 KL。
  kl_warmup_epochs: 0
  # checkpoint_interval_epochs 控制每隔多少 epoch 覆盖保存 checkpoint_last.pt。
  checkpoint_interval_epochs: 1
  # true 时额外保留每一轮的完整断点，例如 checkpoint_epoch_0009.pt；可从任意轮完整续训。
  save_epoch_checkpoints: true
  # preview_interval_epochs 控制每隔多少 epoch 保存一次输入/重建对照图。
  preview_interval_epochs: 2
  # log_interval_epochs 控制每隔多少 epoch 输出一次汇总日志。
  log_interval_epochs: 1

  # 基础 VAE 禁用 PatchGAN，避免医学灰度重建被推向高对比度伪纹理。
  adversarial:
    # enabled=true 表示创建并训练 PatchDiscriminator。
    enabled: false
    # warmup_epochs 表示前多少个 epoch 不使用对抗损失，以先稳定重建。
    warmup_epochs: 40
    # weight 是生成器对抗损失在总损失中的系数。
    weight: 0.002
    # channels 是 PatchDiscriminator 第一层通道数。
    channels: 64
    # num_layers 是 PatchDiscriminator 的卷积层级数量。
    num_layers: 3

  # early_stopping 根据真实验证集重建误差决定是否提前结束训练。
  early_stopping:
    # enabled=true 会启用早停；设为 false 时始终训练到 epochs。
    enabled: true
    # monitor 固定为 validation_l1，数值越小表示重建越好。
    monitor: validation_l1
    # mode=min 表示只有指标下降才算改善。
    mode: min
    # patience_checks 是连续多少次检查没有改善后停止。
    patience_checks: 20
    # min_delta 是一次改善至少需要下降的绝对幅度。
    min_delta: 0.0001
    # check_interval_epochs 表示每多少个 epoch 检查一次早停条件。
    check_interval_epochs: 1
    # minimum_epochs 保证至少训练这么多 epoch 后才允许早停。
    minimum_epochs: 40
    # reset_on_resume=true 会在续训时清空历史早停计数；false 会接着旧计数。
    reset_on_resume: false
