# ============================================================================
# condense 阶段配置：原始 IDM 同构动态模型池指导冻结扩散生成器优化 z_T。
# ============================================================================

# condensation 是论文主方法的核心参数；本阶段不再读取任何静态专家权重。
condensation:
  # ipc_values 是默认执行的每类图像数；命令行 --ipc 可以只运行其中一个。
  ipc_values: [1, 10, 50]
  # initialize 可选 real_noised 或 gaussian；前者把真实隐变量加到最大噪声。
  initialize: real_noised
  # 每次损失计算的真实参考图数量按架构限制。224×224 浅层特征很大；
  # 下列值按 RTX 4070 Ti SUPER 16GB 设置，长期迭代仍会覆盖完整真实分布。
  real_per_class:
    convnet: 16
    resnet18: 16
    convnext_tiny: 16
    vit_tiny: 16
  # 真实图像首次解码后以 CPU float16 缓存，避免4000次迭代反复读取和resize。
  cache_real_images: true
  # latent_learning_rate 是唯一可学习变量 z_T 的 Adam 学习率。
  latent_learning_rate: 0.03
  # z_T 不是普通网络权重，不应被 AdamW 持续向零收缩。
  latent_optimizer: adam
  # latent_weight_decay 仅在 latent_optimizer=adamw 时生效；当前明确关闭。
  latent_weight_decay: 0.0
  # gradient_clip_norm 是每次更新前 z_T 梯度的范数上限；0 表示关闭。
  gradient_clip_norm: 10.0
  # diffusion_gradient_checkpointing 用重新计算 DDIM U-Net 激活换取更低峰值显存。
  diffusion_gradient_checkpointing: false
  # checkpoint_interval_iterations 表示每多少次蒸馏迭代保存完整断点。
  checkpoint_interval_iterations: 50
  # 每隔多少次迭代保存一次可独立评估的完整快照：
  # checkpoint.pt、synthetic.pt、preview.png 和逐类 PNG；0 表示关闭。
  snapshot_interval_iterations: 1000
  # 轻量预览同样按 1000 步保存，避免在快照之间反复执行 DDIM 解码。
  preview_interval_iterations: 1000
  # 完整预览按该 batch 分批执行 DDIM+VAE 解码，只影响速度和峰值显存。
  preview_batch_size: 4
  # 最终导出同样分批解码；不要沿用扩散训练 batch，否则 IPC=50 容易在导出时 OOM。
  export_batch_size: 4
  # log_interval_iterations 表示每多少次迭代打印损失与在线队列状态。
  log_interval_iterations: 1

  # synthetic_per_class_per_step 限制一次反传处理每类多少个 z_T，以控制显存。
  synthetic_per_class_per_step:
    # IPC=1 时每类只有一个隐变量，因此每次都更新它。
    "1": 1
    # IPC=10 每轮随机更新两个，降低可微 DDIM batch 的显存峰值。
    "10": 10
    # IPC=50 同样每轮随机更新两个，长期迭代仍会覆盖全部隐变量。
    "50": 16

  # iterations 给出每个 IPC 的最大蒸馏迭代数。
  iterations:
    # IPC=1 的最大优化次数。
    "1": 4000
    # IPC=10 的最大优化次数。
    "10": 6000
    # IPC=50 的最大优化次数。
    "50": 8000

  # ddim_steps 给出每次从 z_T 可微去噪到 z_0 的步数。
  ddim_steps:
    # IPC=1 使用更多步以强化单张图像的生成先验。
    "1": 20
    # IPC=10 的折中采样步数。
    "10": 16
    # IPC=50 为控制计算量使用更少采样步。
    "50": 12

  # guidance_scale 给出每个 IPC 的 classifier-free guidance 强度。
  guidance_scale:
    # IPC=1 更强调类别条件。
    "1": 2.5
    # IPC=10 使用中等类别引导。
    "10": 2.0
    # IPC=50 降低引导以保留更丰富的类内变化。
    "50": 1.5

  # idm_queue 是单一可选架构的同构大模型池；“每轮抽 2 个”不等于池里只有 2 个。
  idm_queue:
    # 可选 convnet、resnet18、convnext_tiny、vit_tiny；同一次实验不能混用。
    architecture: convnet
    # 第一次凝聚前准备四个随机模型，接近官方“先建3个、iteration 0再加1个”。
    initial_size: 4
    # 16GB 显存下限制常驻 GPU 的模型/优化器数量，避免队列增长后才发生 OOM。
    maximum_size:
      convnet: 100
      resnet18: 100
      convnext_tiny: 50
      vit_tiny: 50
    # 每轮随机抽取两个模型，对其 IDM/分层拓扑梯度做等权平均。
    models_per_iteration: 2
    # 每个被抽模型在合成数据更新后使用真实数据训练 K=10 步。
    train_steps_per_model: 10
    # 每 30 次凝聚加入一个全新随机种子；达到上限后 FIFO 淘汰最老成员。
    generate_interval_iterations: 30
    # 在线真实分类训练 batch；224×224 下不能照搬 32×32 IDM 的大 batch。
    batch_size:
      convnet: 64
      resnet18: 64
      convnext_tiny: 64
      vit_tiny: 64
    # 原 IDM 的模型训练交叉熵不使用标签平滑。
    label_smoothing: 0.0
    # 训练准确率 EMA 仅用于调节合成图像分类损失，不影响分布/拓扑项。
    accuracy_ema_decay: 0.90
    # 尚未训练的随机模型仍保留少量类别监督，分布匹配项始终完整参与。
    minimum_reliability: 0.10
    # 每个模型维护独立优化器；策略根据当前 architecture 自动选择。
    optimization:
      convnet:
        optimizer: sgd
        learning_rate: 0.01
        momentum: 0.9
        weight_decay: 0.0001
        nesterov: true
      resnet18:
        optimizer: sgd
        learning_rate: 0.05
        momentum: 0.9
        weight_decay: 0.0005
        nesterov: true
      convnext_tiny:
        optimizer: adamw
        learning_rate: 0.0005
        weight_decay: 0.05
        beta1: 0.9
        beta2: 0.999
      vit_tiny:
        optimizer: adamw
        learning_rate: 0.0005
        weight_decay: 0.05
        beta1: 0.9
        beta2: 0.999

  # topology 定义浅、中、深特征内部的通用 RBF 亲和图，不使用任何解剖节点。
  topology:
    # grids 把所选网络不同层的空间尺寸统一池化到指定网格。
    grids:
      # 浅层特征网格大小。
      shallow: [14, 14]
      # 中层特征网格大小。
      middle: [7, 7]
      # 深层特征网格大小。
      deep: [7, 7]
    # divergence 可选 js、kl 或 mse，用于比较真实与合成亲和关系。
    divergence: js
    # bandwidth=real_median 使用真实特征距离中位数确定 RBF 带宽。
    bandwidth: real_median
    # minimum_bandwidth 防止同质特征产生除零或极端梯度。
    minimum_bandwidth: 0.0001

  # early_stopping 可根据平滑蒸馏损失停滞提前结束；在线队列使损失有噪声，默认关闭。
  early_stopping:
    # enabled=false 表示默认严格跑满 iterations。
    enabled: false
    # monitor 固定为 smoothed_total_loss，数值越小越好。
    monitor: smoothed_total_loss
    # mode=min 表示平滑损失下降才算改善。
    mode: min
    # patience_checks 是连续多少次检查无改善后停止整个 IPC 蒸馏。
    patience_checks: 30
    # min_delta 是平滑损失至少下降多少才算改善。
    min_delta: 0.0001
    # check_interval_iterations 表示每隔多少次蒸馏迭代检查一次。
    check_interval_iterations: 100
    # minimum_iterations 保证至少执行这么多次蒸馏迭代。
    minimum_iterations: 1000
    # smoothing_decay 是总损失指数移动平均的衰减率。
    smoothing_decay: 0.95
    # reset_on_resume 控制续训时是否清空早停历史。
    reset_on_resume: false

  # loss_profiles 按 IPC 调整可可靠估计的统计量；所有权重都可以独立修改。
  loss_profiles:
    # IPC=1 无法估计类内协方差与多样性，因此集中匹配均值、分类与中深层结构。
    "1":
      # 原始未归一化类别特征中心平方距离权重。
      mean: 1.00
      # 合成图像类别交叉熵权重，实际还会乘在线成员可靠性。
      cross_entropy: 0.50
      # 单样本不估计协方差。
      covariance: 0.00
      # 单样本不估计 MMD。
      mmd: 0.00
      # 单样本不计算类内多样性。
      diversity: 0.00
      # 浅层 RBF 亲和关系权重。
      topology_shallow: 0.10
      # 中层 RBF 亲和关系权重。
      topology_middle: 0.40
      # 深层 RBF 亲和关系权重。
      topology_deep: 0.50
      # z_T 均值接近 0、标准差接近 1 的先验权重。
      latent_prior: 0.005
    # IPC=10 仍使用原 IDM 的均值匹配+分类正则，并叠加本文分层拓扑创新。
    "10":
      # 全局特征均值匹配权重。
      mean: 1.00
      # 类别交叉熵权重。
      cross_entropy: 0.50
      # 原 IDM 不额外引入协方差匹配。
      covariance: 0.00
      # 原 IDM 不额外引入 MMD。
      mmd: 0.00
      # 原 IDM 不额外引入显式多样性惩罚。
      diversity: 0.00
      # 浅层拓扑权重。
      topology_shallow: 0.15
      # 中层拓扑权重。
      topology_middle: 0.35
      # 深层拓扑权重。
      topology_deep: 0.40
      # 隐变量标准正态先验权重。
      latent_prior: 0.005
    # IPC=50 使用论文中更弱的分类正则，继续保留分层拓扑。
    "50":
      # 全局特征均值匹配权重。
      mean: 1.00
      # 类别交叉熵权重。
      cross_entropy: 0.10
      # 关闭非 IDM 的协方差项。
      covariance: 0.00
      # 关闭非 IDM 的 MMD 项。
      mmd: 0.00
      # 关闭非 IDM 的显式多样性项。
      diversity: 0.00
      # 浅层拓扑权重。
      topology_shallow: 0.20
      # 中层拓扑权重。
      topology_middle: 0.30
      # 深层拓扑权重。
      topology_deep: 0.30
      # 高 IPC 下稍微减弱隐变量先验，允许覆盖更多模式。
      latent_prior: 0.003
