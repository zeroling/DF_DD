# ============================================================================
# train_diffusion 阶段配置：在冻结 VAE 隐空间训练类别条件扩散 U-Net。
# ============================================================================

# diffusion 节点同时决定 DDPM 训练和后续 DDIM 可微采样的公共噪声定义。
diffusion:
  # epochs 是扩散模型最大训练轮数；断点恢复后继续到该目标值。
  epochs: 300
  # batch_size 是每次编码真实图像并训练噪声预测器的 batch size。
  batch_size: 64
  # learning_rate 是 DiffusionModelUNet 的 AdamW 初始学习率。
  learning_rate: 0.0001
  # min_learning_rate 是余弦退火结束时的最低学习率。
  min_learning_rate: 0.000001
  # weight_decay 是扩散 U-Net 优化器的权重衰减。
  weight_decay: 0.00001
  # gradient_clip_norm 是 U-Net 梯度范数上限；0 表示不裁剪。
  gradient_clip_norm: 1.0
  # train_timesteps 是 DDPM 前向加噪的离散时间步总数。
  train_timesteps: 1000
  # beta_schedule 是 MONAI/生成模型调度器使用的噪声方差曲线。
  beta_schedule: scaled_linear_beta
  # prediction_type 可选 epsilon 或 v_prediction，训练和采样必须保持一致。
  prediction_type: epsilon
  # min_snr_gamma 是 Min-SNR 损失截断值；设为 0 可退化为普通均方误差。
  min_snr_gamma: 5.0
  # class_dropout 是训练时把类别替换为空类别的概率，用于 classifier-free guidance。
  class_dropout: 0.10
  # ema_decay 是扩散权重指数移动平均衰减率；蒸馏阶段优先读取 EMA 权重。
  ema_decay: 0.999
  # 扩散模型学习真实数据分布，默认关闭空间与强度增强；不会覆盖全局分类增强。
  augmentation:
    enabled: false
  # channels 给出扩散 U-Net 每个分辨率阶段的通道数。
  channels: [128, 256, 512]
  # num_res_blocks 给出每个分辨率阶段的残差块数量。
  num_res_blocks: [2, 2, 2]
  # attention_levels 指定每个阶段是否启用注意力。
  attention_levels: [false, true, true]
  # num_head_channels 给出每个阶段每个注意力头的通道数。
  num_head_channels: [32, 32, 32]
  # norm_num_groups 是扩散 U-Net 中 GroupNorm 的组数。
  norm_num_groups: 32
  # checkpoint_interval_epochs 控制 checkpoint_last.pt 的保存轮次间隔。
  checkpoint_interval_epochs: 1
  # preview_interval_epochs 控制类别条件采样预览图的保存轮次间隔。
  preview_interval_epochs: 25
  # log_interval_epochs 控制训练日志的输出轮次间隔。
  log_interval_epochs: 1
  # 常规预览用 250 步控制耗时；训练结束或早停时改用完整 1000 步。
  preview_steps: 250
  final_preview_steps: 1000
  # 固定初始高斯噪声，使不同 epoch 以及 raw/EMA 图像能够直接比较。
  preview_seed: 2026
  # preview_guidance_scale 是预览图使用的 classifier-free guidance 强度。
  preview_guidance_scale: 2.5
  # validation_batches 限制每轮验证最多计算多少个 batch；0 表示完整验证集。
  validation_batches: 8
  # validation_seed 固定每轮验证使用的噪声与时间步，并且不会扰动训练随机序列。
  validation_seed: 2026

  # early_stopping 根据真实验证隐变量上的去噪损失决定是否提前停止。
  early_stopping:
    # enabled=true 会启用早停；扩散验证损失较噪时也可以设为 false。
    enabled: true
    # monitor 固定为 validation_diffusion_loss，数值越小越好。
    monitor: validation_diffusion_loss
    # mode=min 表示损失下降才算改善。
    mode: min
    # patience_checks 是连续多少次检查无改善后停止。
    patience_checks: 30
    # min_delta 是验证损失至少下降多少才重置耐心计数。
    min_delta: 0.0001
    # check_interval_epochs 表示每多少个 epoch 执行一次早停检查。
    check_interval_epochs: 1
    # minimum_epochs 保证扩散模型至少训练这些 epoch。
    minimum_epochs: 80
    # reset_on_resume 控制续训时是否清空早停历史。
    reset_on_resume: false
